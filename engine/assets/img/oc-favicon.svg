<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="OpenChair">
  <title>OpenChair</title>
  <defs>
    <linearGradient id="ocFav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0755E"/>
      <stop offset="1" stop-color="#E75C43"/>
    </linearGradient>
  </defs>
  <!-- Mark only. At 16px the wordmark is unreadable, so the tab icon is the
       chair grid alone — booked, booked, partly open, open. -->
  <rect width="32" height="32" rx="8" fill="url(#ocFav)"/>
  <g transform="translate(7 7)">
    <rect x="0"  y="0"  width="8" height="8" rx="2.2" fill="#fff"/>
    <rect x="10" y="0"  width="8" height="8" rx="2.2" fill="#fff" opacity=".45"/>
    <rect x="0"  y="10" width="8" height="8" rx="2.2" fill="#fff"/>
    <rect x="10" y="10" width="8" height="8" rx="2.2" fill="#fff" opacity=".18"/>
  </g>
</svg>
